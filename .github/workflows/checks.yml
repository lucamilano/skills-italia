name: Suite checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/italian-pa-frontend/browser-tests/package-lock.json
      - name: Install locked optional tooling
        working-directory: skills/italian-pa-frontend/browser-tests
        run: npm ci --ignore-scripts
      - name: Suite release gate (includes Python, Node, install and archive tests)
        run: python scripts/release_check.py
      - name: Dependency vulnerability audit
        if: runner.os == 'Linux'
        working-directory: skills/italian-pa-frontend/browser-tests
        run: npm audit --audit-level=high
      - name: Install Chromium for synthetic harness test
        if: runner.os == 'Linux'
        working-directory: skills/italian-pa-frontend/browser-tests
        run: npx playwright install --with-deps chromium
      - name: Browser contracts against synthetic localhost fixture (not a PA portal)
        if: runner.os == 'Linux'
        run: python scripts/browser_smoke.py
